name: Verify and publish Wasm

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'release' }}

env:
  ENVOY_IMAGES: >-
    istio/proxyv2:1.31.1
    istio/proxyv2:1.30.5
    envoyproxy/envoy:v1.39.1
    envoyproxy/envoy:v1.38.4
  BUILD_IMAGE: golang:1.26.8-trixie@sha256:bdca99a00bc16590cb1a0bb4e698f5fc5d6a64e4d5eef13d9f18a0ee08e5fa65
  LLVM_PACKAGE_VERSION: 1:19.1.7-3+b1
  BINARYEN_PACKAGE_VERSION: 120-4
  TINYGO_COMMIT: a4f9c9d1b6703211d20dca57d92c42afa44493cd
  TINYGO_ARCHIVE_SHA256: e156d1d93a376eef639a4143d13be07e8c463fb6cf2d7d447698ed4474d23e91

jobs:
  verify:
    if: github.repository == 'd5cr/public-coraza-wasm' && !github.event.repository.private
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        multiphase: [false, true]
    env:
      MULTIPHASE_EVAL: ${{ matrix.multiphase }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            magefiles/go.sum
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/tinygo
            ~/.cache/coraza-compiler/tinygo
          key: tinygo-gc5751-${{ runner.os }}-${{ hashFiles('magefiles/tinygo-gc.patch', '.github/workflows/ci.yaml', 'go.sum', 'magefiles/go.sum') }}
      - name: Cache compiled modules by build inputs
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build/cached-wasm
          key: wasm-gc5751-${{ runner.os }}-${{ matrix.multiphase }}-${{ hashFiles('**/*.go', '**/go.mod', '**/go.sum', 'go.work', 'magefiles/wasip1-envoy.json', 'magefiles/tinygo-gc.patch', 'wasmplugin/rules/**', '.github/workflows/ci.yaml') }}
      - name: Check formatting
        run: test -z "$(gofmt -l wasmplugin/*.go)"
      - name: Build and test evaluation mode
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.cache/tinygo" "$HOME/.cache/coraza-compiler" "$(go env GOPATH)/pkg/mod" "$(go env GOCACHE)"
          docker run --detach --name coraza-build \
            --env TINYGO_COMMIT --env TINYGO_ARCHIVE_SHA256 \
            --env LLVM_PACKAGE_VERSION --env BINARYEN_PACKAGE_VERSION \
            --env GOFLAGS=-buildvcs=false --env GOPATH=/go --env GOCACHE=/go-build \
            --env XDG_CACHE_HOME=/tinygo-cache --env MAGEFILE_CACHE=/go-build/mage \
            --env TINYGOROOT=/compiler/tinygo \
            --env PATH=/compiler/tinygo/bin:/usr/lib/llvm-19/bin:/usr/local/go/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin \
            --volume "$PWD:/src" --workdir /src \
            --volume "$(go env GOPATH)/pkg:/go/pkg" \
            --volume "$(go env GOCACHE):/go-build" \
            --volume "$HOME/.cache/tinygo:/tinygo-cache/tinygo" \
            --volume "$HOME/.cache/coraza-compiler:/compiler" \
            "$BUILD_IMAGE" sleep infinity
          trap 'docker rm --force coraza-build' EXIT
          docker exec coraza-build bash -euo pipefail -c '
            apt-get update -qq
            apt-get install -y --no-install-recommends \
              "clang-19=$LLVM_PACKAGE_VERSION" "llvm-19-dev=$LLVM_PACKAGE_VERSION" \
              "libclang-19-dev=$LLVM_PACKAGE_VERSION" "lld-19=$LLVM_PACKAGE_VERSION" \
              "binaryen=$BINARYEN_PACKAGE_VERSION"
            if [ ! -x /compiler/tinygo/bin/tinygo ]; then
              rm -rf /compiler/tinygo /compiler/release
              git init /compiler/tinygo
              git -C /compiler/tinygo remote add origin https://github.com/tinygo-org/tinygo.git
              git -C /compiler/tinygo fetch --depth=1 origin "$TINYGO_COMMIT"
              git -C /compiler/tinygo checkout --detach FETCH_HEAD
              test "$(git -C /compiler/tinygo rev-parse HEAD)" = "$TINYGO_COMMIT"
              curl -fL --retry 3 https://github.com/tinygo-org/tinygo/releases/download/v0.41.1/tinygo0.41.1.linux-amd64.tar.gz -o /compiler/release.tar.gz
              echo "$TINYGO_ARCHIVE_SHA256  /compiler/release.tar.gz" | sha256sum -c -
              mkdir /compiler/release
              tar -xzf /compiler/release.tar.gz -C /compiler/release
              cp -a /compiler/release/tinygo/lib/. /compiler/tinygo/lib/
              cp -a /compiler/release/tinygo/src/net/. /compiler/tinygo/src/net/
              git -C /compiler/tinygo apply /src/magefiles/tinygo-gc.patch
              cd /compiler/tinygo
              go build -tags=llvm19 -o bin/tinygo .
            fi
            cd /compiler/tinygo
            tinygo version
            go test -tags=llvm19 ./transform -run TestMakeGCStackSlots -count=1
            tinygo build -target=wasi -scheduler=none -gc=precise -opt=z -o /compiler/gc-liveness.wasm testdata/gc-liveness-repro.go
            cd /src
            go run github.com/tetratelabs/wazero/cmd/wazero@v1.12.0 run /compiler/gc-liveness.wasm > /compiler/gc-liveness.txt 2>&1
            diff -u /compiler/tinygo/testdata/gc-liveness-repro.txt /compiler/gc-liveness.txt
          '
          docker exec --env MULTIPHASE_EVAL="$MULTIPHASE_EVAL" coraza-build sh -ec '
            go test ./magefiles/... -count=1
            mkdir -p build/cached-wasm
            cached="build/cached-wasm/$MULTIPHASE_EVAL"
            if [ -s "$cached/main.wasm" ] && [ -s "$cached/mainraw.wasm" ]; then
              cp "$cached/main.wasm" "$cached/mainraw.wasm" build/
            else
              go run mage.go build
              mkdir -p "$cached"
              cp build/main.wasm build/mainraw.wasm "$cached/"
            fi
          '
          sha256sum build/main.wasm
          tags=()
          if [[ "$MULTIPHASE_EVAL" == true ]]; then tags=(-tags=coraza.rule.multiphase_evaluation); fi
          go test -failfast "${tags[@]}" ./... -count=1
          # Race-check native code without instrumenting the Wasm interpreter.
          go test -race "${tags[@]}" ./wasmplugin ./internal/... -count=1
          # Intermittent initialization panics require repeated fresh VM starts.
          ENVOY_IMAGE=istio/proxyv2:1.31.1 go test -tags=envoy ./wasmplugin -run '^TestDecisionHeaderEnvoy$/^startup$' -count=100 -failfast -timeout=15m
          for image in $ENVOY_IMAGES; do
            docker pull "$image"
            ENVOY_IMAGE="$image" go test -tags=envoy ./wasmplugin -run TestDecisionHeaderEnvoy -count=3 -failfast
          done
      - name: Check reachable Go vulnerabilities
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 -tags=coraza.rule.multiphase_evaluation ./wasmplugin ./internal/...
      - name: Retain the verified release module
        if: github.event_name == 'release' && matrix.multiphase
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-wasm
          path: build/main.wasm
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: verify
    if: github.event_name == 'release' && github.repository == 'd5cr/public-coraza-wasm' && !github.event.repository.private
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-wasm
          path: build
      - name: Publish the verified release to GHCR
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          IMAGE: ghcr.io/d5cr/public-coraza-wasm
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$RELEASE_TAG" =~ ^[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}$ ]]; then
            echo "Release tag must be a valid container tag." >&2
            exit 1
          fi
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "$GHCR_USER" --password-stdin
          revision="$(git rev-parse HEAD)"
          if docker pull "$IMAGE:$RELEASE_TAG"; then
            existing="$(docker image inspect "$IMAGE:$RELEASE_TAG" --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}')"
            if [[ "$existing" == "$revision" ]]; then
              echo "This release commit is already published."
              exit 0
            fi
            echo "Refusing to overwrite a release tag from another commit." >&2
            exit 1
          fi
          docker build --tag "$IMAGE:$RELEASE_TAG" \
            --label org.opencontainers.image.source=https://github.com/d5cr/public-coraza-wasm \
            --label org.opencontainers.image.revision="$revision" \
            --label org.opencontainers.image.version="$RELEASE_TAG" .
          docker push "$IMAGE:$RELEASE_TAG"
          docker image inspect "$IMAGE:$RELEASE_TAG" --format '{{json .RepoDigests}}' >> "$GITHUB_STEP_SUMMARY"
