name: Verify and publish Wasm

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'release' }}

env:
  ENVOY_IMAGES: >-
    istio/proxyv2:1.31.1
    istio/proxyv2:1.30.5
    envoyproxy/envoy:v1.39.1
    envoyproxy/envoy:v1.38.4
  TINYGO_IMAGE: tinygo/tinygo:0.41.0@sha256:0376cd2d957e7304a1a653e2f7ef44cc27e1caa3a445073dfb09731ad4c19fec

jobs:
  verify:
    if: github.repository == 'd5cr/public-coraza-wasm' && !github.event.repository.private
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            magefiles/go.sum
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/tinygo
          key: tinygo-0.41.0-${{ runner.os }}-${{ hashFiles('go.sum', 'magefiles/go.sum') }}
          restore-keys: tinygo-0.41.0-${{ runner.os }}-
      - name: Cache compiled modules by build inputs
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build/cached-wasm
          key: wasm-0.41.0-${{ runner.os }}-${{ hashFiles('**/*.go', '**/go.mod', '**/go.sum', 'go.work', 'magefiles/wasip1-envoy.json', 'wasmplugin/rules/**', '.github/workflows/ci.yaml') }}
      - name: Check formatting
        run: test -z "$(gofmt -l wasmplugin/*.go)"
      - name: Build and test both evaluation modes
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.cache/tinygo" "$(go env GOPATH)/pkg/mod" "$(go env GOCACHE)"
          for multiphase in false true; do
            docker run --rm --user "$(id -u):$(id -g)" \
              --env MULTIPHASE_EVAL="$multiphase" --env GOFLAGS=-buildvcs=false \
              --env GOPATH=/go --env GOCACHE=/go-build \
              --env XDG_CACHE_HOME=/tinygo-cache --env MAGEFILE_CACHE=/go-build/mage \
              --volume "$PWD:/src" --workdir /src \
              --volume "$(go env GOPATH)/pkg:/go/pkg" \
              --volume "$(go env GOCACHE):/go-build" \
              --volume "$HOME/.cache/tinygo:/tinygo-cache/tinygo" \
              "$TINYGO_IMAGE" sh -ec '
                go test ./magefiles/...
                mkdir -p build/cached-wasm
                cached="build/cached-wasm/$MULTIPHASE_EVAL"
                if [ -s "$cached/main.wasm" ] && [ -s "$cached/mainraw.wasm" ]; then
                  cp "$cached/main.wasm" "$cached/mainraw.wasm" build/
                else
                  go run mage.go build
                  mkdir -p "$cached"
                  cp build/main.wasm build/mainraw.wasm "$cached/"
                fi
              '
            sha256sum build/main.wasm
            tags=()
            if [[ "$multiphase" == true ]]; then tags=(-tags=coraza.rule.multiphase_evaluation); fi
            go test -failfast "${tags[@]}" ./...
            # Race-check native code without instrumenting the Wasm interpreter.
            go test -race "${tags[@]}" ./wasmplugin ./internal/...
            for image in $ENVOY_IMAGES; do
              docker pull "$image"
              ENVOY_IMAGE="$image" go test -tags=envoy ./wasmplugin -run TestDecisionHeaderEnvoy -count=3 -failfast
            done
          done
      - name: Check reachable Go vulnerabilities
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 -tags=coraza.rule.multiphase_evaluation ./wasmplugin ./internal/...
      - name: Retain the verified release module
        if: github.event_name == 'release'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-wasm
          path: build/main.wasm
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: verify
    if: github.event_name == 'release' && github.repository == 'd5cr/public-coraza-wasm' && !github.event.repository.private
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-wasm
          path: build
      - name: Publish the verified release to GHCR
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          IMAGE: ghcr.io/d5cr/public-coraza-wasm
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$RELEASE_TAG" =~ ^[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}$ ]]; then
            echo "Release tag must be a valid container tag." >&2
            exit 1
          fi
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "$GHCR_USER" --password-stdin
          revision="$(git rev-parse HEAD)"
          if docker pull "$IMAGE:$RELEASE_TAG"; then
            existing="$(docker image inspect "$IMAGE:$RELEASE_TAG" --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}')"
            if [[ "$existing" == "$revision" ]]; then
              echo "This release commit is already published."
              exit 0
            fi
            echo "Refusing to overwrite a release tag from another commit." >&2
            exit 1
          fi
          docker build --tag "$IMAGE:$RELEASE_TAG" \
            --label org.opencontainers.image.source=https://github.com/d5cr/public-coraza-wasm \
            --label org.opencontainers.image.revision="$revision" \
            --label org.opencontainers.image.version="$RELEASE_TAG" .
          docker push "$IMAGE:$RELEASE_TAG"
          docker image inspect "$IMAGE:$RELEASE_TAG" --format '{{json .RepoDigests}}' >> "$GITHUB_STEP_SUMMARY"
