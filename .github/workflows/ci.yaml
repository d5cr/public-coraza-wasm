name: Verify Wasm

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

env:
  ENVOY_IMAGES: >-
    istio/proxyv2:1.31.1
    istio/proxyv2:1.30.5
    envoyproxy/envoy:v1.39.1
    envoyproxy/envoy:v1.38.4
  TINYGO_IMAGE: tinygo/tinygo:0.34.0@sha256:79c73c4246a1079e648d6e8425bae4654f26d2baed24c96537a8893b41c04d26

jobs:
  verify:
    if: github.repository == 'd5cr/public-coraza-wasm' && !github.event.repository.private
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            magefiles/go.sum
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/tinygo
          key: tinygo-0.34.0-${{ runner.os }}-${{ hashFiles('go.sum', 'magefiles/go.sum') }}
          restore-keys: tinygo-0.34.0-${{ runner.os }}-
      - name: Check formatting
        run: test -z "$(gofmt -l wasmplugin/*.go)"
      - name: Build and test both evaluation modes
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.cache/tinygo" "$(go env GOPATH)/pkg/mod" "$(go env GOCACHE)"
          for multiphase in false true; do
            docker run --rm --user "$(id -u):$(id -g)" \
              --env MULTIPHASE_EVAL="$multiphase" --env GOFLAGS=-buildvcs=false \
              --env GOPATH=/go --env GOCACHE=/go-build \
              --env XDG_CACHE_HOME=/tinygo-cache --env MAGEFILE_CACHE=/go-build/mage \
              --volume "$PWD:/src" --workdir /src \
              --volume "$(go env GOPATH)/pkg/mod:/go/pkg/mod" \
              --volume "$(go env GOCACHE):/go-build" \
              --volume "$HOME/.cache/tinygo:/tinygo-cache/tinygo" \
              "$TINYGO_IMAGE" go run mage.go build
            tags=()
            if [[ "$multiphase" == true ]]; then tags=(-tags=coraza.rule.multiphase_evaluation); fi
            go test "${tags[@]}" ./...
            # Race-check native code without instrumenting the Wasm interpreter.
            go test -race "${tags[@]}" ./wasmplugin ./internal/...
            for image in $ENVOY_IMAGES; do
              docker pull "$image"
              ENVOY_IMAGE="$image" go test -tags=envoy ./wasmplugin -run TestDecisionHeaderEnvoy -count=1
            done
          done
